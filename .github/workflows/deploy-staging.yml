# Runs on every merge to main.
# Web (Vercel) and worker (Render) deploy themselves from main through their GitHub integrations;
# this workflow handles the parts they can't: database migrations and mobile over-the-air updates.
# Each job stays skipped until its repository variable is set (see docs/runbooks/infrastructure-setup.md).

name: Deploy staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  database:
    name: Migrate staging database
    if: ${{ vars.SUPABASE_STAGING_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      - run: supabase db push

  mobile:
    name: Publish mobile update (preview channel)
    needs: database
    # Run after migrations, or on their own if the database job is skipped.
    if: ${{ !failure() && !cancelled() && vars.EAS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish update
        working-directory: apps/mobile
        run: eas update --channel preview --environment preview --auto --non-interactive
